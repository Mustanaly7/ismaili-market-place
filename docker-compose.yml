# ISMAILI Market Place - local development services
# Run: docker compose up -d
#
# Postgres and Redis are all the app requires. Product images are stored on
# local disk (public/uploads) by default, so no object-storage service is
# needed for local development.
#
# Want S3/MinIO instead? MinIO images are no longer published on Docker Hub
# (and quay.io may be blocked on some networks). Use your own reachable S3 or
# MinIO endpoint, then set S3_ENDPOINT/S3_ACCESS_KEY/S3_SECRET_KEY in .env.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ismaili-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ismaili
      POSTGRES_PASSWORD: ismaili
      POSTGRES_DB: ismaili
    ports:
      - "5433:5432"
    volumes:
      - ismaili_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ismaili -d ismaili"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ismaili-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ismaili_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ismaili_pgdata:
  ismaili_redisdata: